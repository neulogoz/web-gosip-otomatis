name: AGC Gosip Updater

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4   # <-- Diubah dari v3 menjadi v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5  # <-- Diubah dari v4 menjadi v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Script Scraper & Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_scraper.py

      - name: Commit dan Push Hasil Berita Baru
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add content/
          
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Auto-update: Menambah berita gosip baru dari RSS"
            git push
          else
            echo "Tidak ada berita baru yang diproses."
          fi
