name: AGC Gosip Updater

on:
  schedule:
    # Mengatur bot agar berjalan otomatis setiap 6 jam sekali
    - cron: '0 */6 * * *' 
  workflow_dispatch: 
    # Memungkinkan Anda menjalankan bot secara manual menggunakan tombol "Run workflow"

# Memberikan izin agar bot GitHub Actions bisa menyimpan (push) file berita baru ke repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # Menginstal library yang ada di dalam requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Script Scraper & Gemini
        # Menarik kunci rahasia Gemini API dari GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_scraper.py

      - name: Commit dan Push Hasil Berita Baru
        # Menyimpan file HTML baru yang dihasilkan script ke dalam folder content/
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add content/
          
          # Mengecek apakah ada file baru yang dibuat. Jika ada, lakukan commit & push.
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Auto-update: Menambah berita gosip baru dari RSS"
            git push
          else
            echo "Tidak ada berita baru yang diproses."
          fi
