name: Bot AGC Gosip Otomatis

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-berita:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install modul Python yang dibutuhkan
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai feedparser httpx curl_cffi

      - name: Jalankan Script Pencari Berita
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_scraper.py

      - name: Simpan dan Upload Artikel Baru
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add content/
          git commit -m "Update gosip terbaru via AI" || echo "Tidak ada artikel baru"
          git push
